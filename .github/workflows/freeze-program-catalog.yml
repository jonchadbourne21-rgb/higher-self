name: Freeze recovered program catalog

on:
  push:
    branches:
      - repair/build4-parity
    paths:
      - .github/workflows/freeze-program-catalog.yml

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Checkout pinned canonical source
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/mirrored-canonical-source 0c67fac5cfd4d0bc419f79595944a49f6ba45b91

      - name: Extract source-pinned catalog candidate
        run: |
          set -euo pipefail
          rm -f /tmp/recovered-program-catalog-v2.json
          node scripts/parity/extract-programs.mjs \
            --source-root /tmp/mirrored-canonical-source \
            --out /tmp/recovered-program-catalog-v2.json

      - name: Verify pinned v2 catalog and voice-day reconciliation
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { digest, validateCatalog } from './scripts/parity/catalog.mjs';
          const expectedHash = '91f6afbb4a2af877f69902a3ba78c4efce2081e8aa55061e6cedefd49189c486';
          const catalog = validateCatalog(JSON.parse(fs.readFileSync('/tmp/recovered-program-catalog-v2.json','utf8')));
          const programs = catalog.programs.length;
          const lessons = catalog.programs.reduce((n,p)=>n+p.lessons.length,0);
          const voiceDays = catalog.programs.flatMap(p=>p.lessons.filter(l=>l.isVoiceDay).map(l=>`${p.program.slug}:${l.day}`));
          const expectedVoiceDays = ['ifs-parts-work:3','ifs-parts-work:12','ifs-parts-work:21'];
          const hash = digest(catalog);
          if (programs !== 7) throw new Error(`EXPECTED_7_PROGRAMS_GOT_${programs}`);
          if (lessons !== 178) throw new Error(`EXPECTED_178_LESSONS_GOT_${lessons}`);
          if (JSON.stringify(voiceDays)!==JSON.stringify(expectedVoiceDays)) throw new Error(`VOICE_DAY_SET_MISMATCH_${JSON.stringify(voiceDays)}`);
          if (hash !== expectedHash) throw new Error(`CATALOG_HASH_MISMATCH_${hash}`);
          console.log(JSON.stringify({status:'PASS_CATALOG_V2_PINNED', programs, lessons, voiceDays, catalogHash:hash}));
          NODE

      - name: Require committed v2 catalog to match regenerated bytes
        run: |
          set -euo pipefail
          cmp -s /tmp/recovered-program-catalog-v2.json scripts/parity/recovered-program-catalog-v2.json
          echo 'Committed v2 catalog matches regenerated bytes.'
