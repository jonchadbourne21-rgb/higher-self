name: Build 4 Parity Verify

on:
  push:
    branches:
      - repair/build4-parity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-and-server:
    name: Frozen dependencies, typecheck, build, core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exactly the committed dependency graph
        run: pnpm install --frozen-lockfile

      - name: Verify canonical iOS identity and Apple entitlement binding
        shell: bash
        run: |
          set -euo pipefail
          PBX='ios/App/App.xcodeproj/project.pbxproj'
          PLIST='ios/App/App/Info.plist'
          ENT='ios/App/App/App.entitlements'

          test "$(grep -c 'PRODUCT_BUNDLE_IDENTIFIER = com.mirrored.aiself;' "$PBX")" -eq 2
          test "$(grep -c 'CODE_SIGN_ENTITLEMENTS = App/App.entitlements;' "$PBX")" -eq 2
          test "$(grep -c 'PRODUCT_BUNDLE_IDENTIFIER = cloud.higherself.app;' "$PBX" || true)" -eq 0
          grep -q '<string>com.mirrored.aiself</string>' "$PLIST"
          grep -q '<string>mirrored</string>' "$PLIST"
          grep -q 'com.apple.developer.applesignin' "$ENT"
          grep -q '@capawesome/capacitor-apple-sign-in' package.json
          grep -q "'@capawesome/capacitor-apple-sign-in@0.1.4'" pnpm-lock.yaml

      - name: TypeScript check
        run: pnpm check

      - name: Production build
        run: pnpm build

      - name: Core unit suite excluding only credential-presence assertions
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vitest run \
            --exclude '**/humeWebhook.test.ts' \
            --exclude '**/v2v.test.ts' \
            --exclude '**/voice.test.ts'

          # Preserve the useful tests in these files. Only the three assertions
          # whose sole purpose is to prove deployment credentials are present are
          # excluded here; deployment Hume configuration remains a separate HOLD.
          pnpm exec vitest run server/humeWebhook.test.ts \
            --testNamePattern='^(?!should have HUME_WEBHOOK_SIGNING_KEY set in environment$).*$'
          pnpm exec vitest run server/v2v.test.ts \
            --testNamePattern='^(?!should have HUME_API_KEY and HUME_SECRET_KEY set$).*$'
          pnpm exec vitest run server/voice.test.ts \
            --testNamePattern='^(?!returns apiKey and configId from environment$).*$'

      - name: Record Hume deployment HOLD without exposing secrets
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Hume runtime configuration — HOLD
          The compile/unit gate intentionally does not treat missing deployment credentials as a source-code failure.
          The following credential-presence assertions remain open for the deployed Railway environment:
          - `HUME_API_KEY`
          - `HUME_SECRET_KEY`
          - `HUME_WEBHOOK_SIGNING_KEY`
          - the applicable Hume configuration ID

          No secret values are printed or requested by this workflow. This HOLD must be cleared separately before Voice parity can pass.
          EOF

  ios-unsigned-compile:
    name: Clean Capacitor sync and unsigned iOS compile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exactly the committed dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build canonical app
        run: pnpm build

      - name: Require clean tracked iOS state before sync
        run: git diff --exit-code -- ios/

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Reject any uncommitted native repair from Capacitor sync
        run: git diff --exit-code -- ios/

      - name: Verify synced Apple Sign-In plugin
        shell: bash
        run: |
          set -euo pipefail
          npx cap ls ios | tee /tmp/cap-ios-plugins.txt
          grep -F '@capawesome/capacitor-apple-sign-in' /tmp/cap-ios-plugins.txt

      - name: Unsigned iOS simulator compile
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Require clean tracked iOS state after compile
        run: git diff --exit-code -- ios/
