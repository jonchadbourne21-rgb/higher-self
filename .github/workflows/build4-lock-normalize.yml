name: Build 4 Lock Normalize

on:
  push:
    branches:
      - repair/build4-parity
    paths:
      - package.json

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/build4-parity
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard Manus runtime package is absent
        run: '! grep -q "vite-plugin-manus-runtime" package.json'
      - name: Regenerate lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Commit only lockfile drift
        shell: bash
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only)"
          if [ -z "$CHANGED" ]; then
            exit 0
          fi
          test "$CHANGED" = "pnpm-lock.yaml"
          git diff --check
          git config user.name 'JCEE Labs Build 4 Gate'
          git config user.email 'actions@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'Normalize lockfile after runtime dependency cleanup'
          git push origin HEAD:repair/build4-parity
