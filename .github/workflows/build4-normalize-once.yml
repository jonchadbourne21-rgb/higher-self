name: Build 4 Normalize Once

on:
  push:
    branches:
      - repair/build4-parity
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/build4-parity
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Guard expected pre-state
        shell: bash
        run: |
          set -euo pipefail
          PBX='ios/App/App.xcodeproj/project.pbxproj'
          test "$(grep -c 'PRODUCT_BUNDLE_IDENTIFIER = cloud.higherself.app;' "$PBX")" -eq 2
          test "$(grep -c 'CODE_SIGN_ENTITLEMENTS = App/App.entitlements;' "$PBX" || true)" -eq 0
          grep -q '<string>com.mirrored.aiself</string>' ios/App/App/Info.plist
          grep -q '<string>mirrored</string>' ios/App/App/Info.plist
          grep -q 'com.apple.developer.applesignin' ios/App/App/App.entitlements

      - name: Regenerate lockfile from pinned package manifest
        run: pnpm install --no-frozen-lockfile

      - name: Guard lockfile drift
        shell: bash
        run: |
          set -euo pipefail
          FILES="$(git diff --name-only)"
          test "$FILES" = 'pnpm-lock.yaml'
          DIFF="$(git diff -- pnpm-lock.yaml)"
          printf '%s\n' "$DIFF"
          test "$(printf '%s' "$DIFF" | grep -c '^+.*@capawesome/capacitor-apple-sign-in')" -eq 3
          test "$(printf '%s' "$DIFF" | grep -c '^-[^-]' || true)" -eq 0

      - name: Bind App Store identity and Apple entitlement to Xcode target
        shell: bash
        run: |
          set -euo pipefail
          PBX='ios/App/App.xcodeproj/project.pbxproj'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ios/App/App.xcodeproj/project.pbxproj')
          s = p.read_text()
          old = 'PRODUCT_BUNDLE_IDENTIFIER = cloud.higherself.app;'
          if s.count(old) != 2:
              raise SystemExit(f'unexpected old bundle-id count: {s.count(old)}')
          new = 'CODE_SIGN_ENTITLEMENTS = App/App.entitlements;\n\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER = com.mirrored.aiself;'
          s = s.replace(old, new)
          p.write_text(s)
          PY
          test "$(grep -c 'PRODUCT_BUNDLE_IDENTIFIER = com.mirrored.aiself;' "$PBX")" -eq 2
          test "$(grep -c 'CODE_SIGN_ENTITLEMENTS = App/App.entitlements;' "$PBX")" -eq 2
          test "$(grep -c 'PRODUCT_BUNDLE_IDENTIFIER = cloud.higherself.app;' "$PBX" || true)" -eq 0

      - name: Verify only intended files changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          EXPECTED=$'ios/App/App.xcodeproj/project.pbxproj\npnpm-lock.yaml'
          ACTUAL="$(git diff --name-only | sort)"
          test "$ACTUAL" = "$EXPECTED"
          grep -q "'@capawesome/capacitor-apple-sign-in@0.1.4'" pnpm-lock.yaml

      - name: Commit normalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JCEE Labs Build 4 Gate'
          git config user.email 'actions@users.noreply.github.com'
          git add pnpm-lock.yaml ios/App/App.xcodeproj/project.pbxproj
          git commit -m 'Normalize Build 4 dependencies and iOS target [skip ci]'
          git push origin HEAD:repair/build4-parity
