name: Build 4 Hume Token Wiring

on:
  push:
    branches:
      - repair/build4-parity
    paths:
      - .github/workflows/build4-hume-token-wire.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/build4-parity
      - name: Replace permanent Hume key exposure with short-lived access token
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          relay = Path('server/v2vRelay.ts')
          text = relay.read_text()
          old = 'async function fetchHumeAccessToken(): Promise<string> {'
          if text.count(old) != 1:
              raise SystemExit('Hume access-token function precondition failed')
          relay.write_text(text.replace(old, 'export async function fetchHumeAccessToken(): Promise<string> {'))

          voice = Path('server/routers/voice.ts')
          text = voice.read_text()
          old = '''  /** Return Hume API key and config ID for direct WebSocket connection */
            mintToken: protectedProcedure
              .input(z.object({ voice: z.enum(["male", "female"]).optional() }).optional())
              .mutation(async ({ input }) => {
                const apiKey = process.env.HUME_API_KEY;
                const maleConfigId = process.env.HUME_CONFIG_ID || "";
                const femaleConfigId = "b5b9a42c-ef7e-42c6-bd7d-7495a10da489";
                if (!apiKey) {
                  throw new TRPCError({ code: "INTERNAL_SERVER_ERROR", message: "Hume API key not configured" });
                }
                const selectedVoice = input?.voice ?? "male";
                const configId = selectedVoice === "female" ? femaleConfigId : maleConfigId;
                return { apiKey, configId };
              }),'''
          new = '''  /** Mint a short-lived Hume client credential; never expose permanent provider keys. */
            mintToken: protectedProcedure
              .input(z.object({ voice: z.enum(["male", "female"]).optional() }).optional())
              .mutation(async ({ input }) => {
                const { fetchHumeAccessToken } = await import("../v2vRelay");
                const maleConfigId = process.env.HUME_CONFIG_ID || "";
                const femaleConfigId = process.env.HUME_FEMALE_CONFIG_ID || "b5b9a42c-ef7e-42c6-bd7d-7495a10da489";
                const selectedVoice = input?.voice ?? "male";
                const configId = selectedVoice === "female" ? femaleConfigId : maleConfigId;
                if (!configId) {
                  throw new TRPCError({ code: "INTERNAL_SERVER_ERROR", message: "Hume config not configured" });
                }
                const accessToken = await fetchHumeAccessToken();
                return { accessToken, configId };
              }),'''
          if text.count(old) != 1:
              raise SystemExit('voice mintToken precondition failed')
          voice.write_text(text.replace(old, new))
          PY
          git diff --check
          test "$(git diff --name-only | sort)" = $'server/routers/voice.ts\nserver/v2vRelay.ts'
          ! grep -q 'return { apiKey, configId }' server/routers/voice.ts
      - name: Commit Hume token contract
        run: |
          git config user.name 'JCEE Labs Build 4 Gate'
          git config user.email 'actions@users.noreply.github.com'
          git add server/routers/voice.ts server/v2vRelay.ts
          git commit -m 'Mint Hume client tokens server-side'
          git push origin HEAD:repair/build4-parity
